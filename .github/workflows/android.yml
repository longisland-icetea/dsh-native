name: Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# `write` because the tagged release lane creates a release and uploads the APK;
# every other event only reads. Scoped per job below rather than repository-wide.
permissions:
  contents: read

jobs:
  # Always-green lane: a debug APK needs no secrets, so a fresh clone always
  # produces something installable.
  debug:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6
      # The version both build paths stamp comes from a shell script, so the
      # shell tests run before the Gradle ones: a broken derivation there fails
      # the release while the Kotlin suite stays green.
      - name: Tool tests
        run: bash ./tools/test-version.sh
      - name: Unit tests
        run: bash ./gradlew --no-daemon testDebugUnitTest
      - name: Assemble debug
        run: bash ./gradlew --no-daemon assembleDebug
      - name: Report APK size
        run: |
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$apk"
          printf 'debug APK: %s (%s bytes)\n' "$apk" "$(stat -c %s "$apk")"
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-native-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Release lane: only meaningful when the signing secrets exist. Without them
  # it falls back to the debug artifact instead of failing the tag build.
  release:
    name: Signed release APK
    permissions:
      contents: write
    # Deliberately not `needs: debug`: a debug-lane failure (artifact upload, size
    # report, a test flake) must not block publishing a signed artifact. The release
    # lane runs the same tests itself.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6
      - name: Detect signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets; skipping the signed release build." >&2
          fi
      - name: Tool tests
        if: steps.signing.outputs.configured == 'true'
        run: bash ./tools/test-version.sh
      - name: Unit tests
        if: steps.signing.outputs.configured == 'true'
        run: bash ./gradlew --no-daemon testDebugUnitTest
      - name: Configure release signing
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dsh-native-release.jks"
      - name: Assemble release
        if: steps.signing.outputs.configured == 'true'
        env:
          DSH_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/dsh-native-release.jks
          DSH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DSH_ANDROID_KEYSTORE_PASSWORD }}
          DSH_ANDROID_KEY_ALIAS: ${{ secrets.DSH_ANDROID_KEY_ALIAS }}
          DSH_ANDROID_KEY_PASSWORD: ${{ secrets.DSH_ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon assembleRelease
      - name: Verify signature
        if: steps.signing.outputs.configured == 'true'
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      # The Gradle output is always `app-release.apk`, which says nothing about
      # which release it is once it is sitting in a download list. The first two
      # releases were renamed by hand for that reason; this does it for them.
      # `tools/version.sh` evaluates to the tag's version on a tag build.
      - name: Name the artifact for the release
        if: steps.signing.outputs.configured == 'true'
        run: |
          eval "$(bash ./tools/version.sh)"
          cp app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/dsh-native-${VERSION_NAME}.apk"
      - name: Publish release
        if: steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/dsh-native-*.apk
          generate_release_notes: true
