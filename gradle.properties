org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ── Why local Gradle builds do not work in this WSL2 VM ──────────────────────
# networkingMode=VirtioProxy breaks a JVM's cross-process loopback socket: a
# ServerSocket bound to 127.0.0.1 never accepts a connection from another Java
# process. Measured with a bare ServerSocket probe: 0/10 connections succeed,
# 10/10 once -Djava.net.preferIPv4Stack=true is set on *both* JVMs.
#
# Gradle always starts a daemon -- --no-daemon, org.gradle.daemon=false and an
# empty org.gradle.jvmargs all still fork one on 8.11 -- and the client must
# reach it over that loopback socket, so "Could not connect to the Gradle
# daemon" is the guaranteed outcome here.
#
# Getting the flag to the daemon is itself blocked: Gradle filters java.net.*
# out of org.gradle.jvmargs (daemonOpts lands as -Xmx2g,-Dfile.encoding=UTF-8,
# -Duser.country,... with no preferIPv4Stack) and the daemon does not inherit
# JAVA_TOOL_OPTIONS from the client.
#
# So either build in GitHub Actions (what this repo does), or change .wslconfig
# off VirtioProxy (or add the daemon ports to ignoredPorts) and restart WSL.
