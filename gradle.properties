# preferIPv4Stack is required in this WSL2 VM (networkingMode=VirtioProxy):
# the JVM's dual-stack loopback socket does not accept an IPv4 self-connection,
# so Gradle's client cannot reach its own daemon ("Could not connect to the
# Gradle daemon"). Verified with a bare ServerSocket: 0/10 connections without
# the flag, 10/10 with it. The daemon needs it here; the client gets it from
# GRADLE_OPTS in the build script.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# NOTE for local builds in this WSL2 VM (networkingMode=VirtioProxy): Gradle
# cannot be run here. A plain ServerSocket bound to 127.0.0.1 refuses a
# connection from the same machine, so the client can never reach the daemon
# socket it starts ("Could not connect to the Gradle daemon"); binding to the
# EasyTier address 192.168.255.5 works, but Gradle's daemon always binds
# loopback, and --no-daemon still forks a single-use daemon on 8.11.
# Builds therefore run in GitHub Actions. To build locally instead, switch
# .wslconfig off VirtioProxy (or add the Gradle daemon ports to ignoredPorts)
# and restart WSL.
